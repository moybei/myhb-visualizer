<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>myhb-visualizer</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div class="app">
    <div class="stage-wrap">
      <canvas id="stage" width="1920" height="1080"></canvas>
      <audio id="audioEl" style="display:none" preload="auto"></audio>
    </div>

    <div class="panel">
      <h1>myhb-visualizer</h1>

      <section>
        <h2>Media</h2>
        <label>Audio file
          <input type="file" id="audioFile" accept="audio/*" />
        </label>
        <label>Album art
          <input type="file" id="albumArtFile" accept="image/*" />
        </label>
      </section>

      <section>
        <h2>Background</h2>
        <label class="radio-row">
          <input type="radio" name="bgMode" value="color" checked /> Plain color
        </label>
        <label class="radio-row">
          <input type="radio" name="bgMode" value="image" /> Custom image
        </label>
        <label class="radio-row">
          <input type="radio" name="bgMode" value="blurredAlbumArt" /> Blurred album art
        </label>

        <label>Background color
          <input type="color" id="bgColor" value="#000000" />
        </label>
        <label>Background image
          <input type="file" id="bgImageFile" accept="image/*" />
        </label>
        <label>Zoom
          <input type="range" id="bgZoom" min="1" max="2" step="0.01" value="1.15" />
        </label>
        <label>Blur
          <input type="range" id="bgBlur" min="0" max="40" step="1" value="18" />
        </label>
      </section>

      <section>
        <h2>Text</h2>
        <label>Original artist
          <input type="text" id="artistName" placeholder="25時、ナイトコードで。× 初音ミク" />
        </label>
        <label>Title
          <input type="text" id="songTitle" placeholder="Bad Apple!! feat. SEKAI (MYHB Remix)" />
        </label>
        <label>Text color
          <input type="color" id="textColor" value="#ffffff" />
        </label>
        <label>Font
          <select id="fontFamily">
            <option value="'Helvetica Neue', Arial, sans-serif">Helvetica / Arial</option>
            <option value="Georgia, 'Times New Roman', serif">Georgia / Serif</option>
            <option value="'Courier New', monospace">Courier / Mono</option>
          </select>
        </label>
      </section>

      <section>
        <h2>Visualizer</h2>
        <label>Bar color
          <input type="color" id="visualizerColor" value="#ffffff" />
        </label>
        <label>Style
          <select id="visualizerStyle">
            <option value="line" selected>Line (thin)</option>
            <option value="bars">Bars</option>
            <option value="mirroredBars">Mirrored bars</option>
          </select>
        </label>
      </section>

      <section>
        <h2>Playback</h2>
        <button id="playBtn" disabled>Play</button>
        <button id="renderBtn" disabled>Render Video</button>
        <div id="status" class="status"></div>
        <a id="downloadLink" class="download-link" style="display:none" download>Download video</a>
      </section>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
